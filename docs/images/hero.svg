<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="t d">
  <title id="t">The four collaboration buttons of the Dell KB525C: Video, Share, Chat, Mic</title>
  <desc id="d">Four keys on a dark keyboard deck. The Video and Share LEDs are white, Chat is dark, Mic is red.</desc>
  <defs>
    <filter id="glowW" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowR" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3340"/>
      <stop offset="1" stop-color="#222833"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181c24"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="229" rx="18" fill="url(#deck)" stroke="#2a303c"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.2" fill="#8d96a3" text-anchor="middle" font-weight="600">
    <text x="120" y="200">VIDEO</text>
    <text x="280" y="200">SHARE</text>
    <text x="440" y="200">CHAT</text>
    <text x="600" y="200">MIC</text>
  </g>

  <g stroke="#e9ecf2" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Video -->
    <g transform="translate(60 40)">
      <rect x="0" y="0" width="120" height="112" rx="14" fill="url(#key)" stroke="#3a4250" stroke-width="1"/>
      <rect x="36" y="38" width="34" height="26" rx="4"/>
      <path d="M70 46 L86 37 V65 L70 56 Z"/>
      <rect x="40" y="92" width="40" height="5" rx="2.5" fill="#fbfbfd" stroke="none" filter="url(#glowW)"/>
    </g>
    <!-- Share -->
    <g transform="translate(220 40)">
      <rect x="0" y="0" width="120" height="112" rx="14" fill="url(#key)" stroke="#3a4250" stroke-width="1"/>
      <rect x="36" y="34" width="48" height="32" rx="3"/>
      <path d="M60 66 V76 M48 76 H72"/>
      <path d="M60 60 V42 M52 49 L60 41 L68 49"/>
      <rect x="40" y="92" width="40" height="5" rx="2.5" fill="#fbfbfd" stroke="none" filter="url(#glowW)"/>
    </g>
    <!-- Chat -->
    <g transform="translate(380 40)">
      <rect x="0" y="0" width="120" height="112" rx="14" fill="url(#key)" stroke="#3a4250" stroke-width="1"/>
      <path d="M40 34 h40 a7 7 0 0 1 7 7 v20 a7 7 0 0 1 -7 7 h-20 l-11 9 v-9 h-9 a7 7 0 0 1 -7 -7 v-20 a7 7 0 0 1 7 -7 z"/>
      <circle cx="50" cy="51" r="1.6" fill="#e9ecf2" stroke="none"/>
      <circle cx="60" cy="51" r="1.6" fill="#e9ecf2" stroke="none"/>
      <circle cx="70" cy="51" r="1.6" fill="#e9ecf2" stroke="none"/>
      <rect x="40" y="92" width="40" height="5" rx="2.5" fill="#3a4150" stroke="none"/>
    </g>
    <!-- Mic -->
    <g transform="translate(540 40)">
      <rect x="0" y="0" width="120" height="112" rx="14" fill="url(#key)" stroke="#3a4250" stroke-width="1"/>
      <rect x="53" y="30" width="14" height="26" rx="7"/>
      <path d="M45 48 a15 15 0 0 0 30 0"/>
      <path d="M60 63 V72 M51 72 H69"/>
      <path d="M42 30 L78 70" stroke="#ff6b60"/>
      <rect x="40" y="92" width="40" height="5" rx="2.5" fill="#ff5a4e" stroke="none" filter="url(#glowR)"/>
    </g>
  </g>
</svg>
